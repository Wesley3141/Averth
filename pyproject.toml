[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpnl"
version = "0.2.0"
description = "Economic meter for production AI agents: fully loaded cost per accepted outcome"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core"]
openai = ["openai"]

[project.scripts]
agentpnl = "agentpnl.cli:main"

[project.urls]
Homepage = "https://github.com/wesleyd3141/agentpnl"

[tool.setuptools.packages.find]
include = ["agentpnl*"]
